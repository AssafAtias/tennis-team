services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: tennis
      POSTGRES_USER: tennis
      POSTGRES_DB: tennis
    ports: ['5433:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tennis -d tennis']
      interval: 5s
      timeout: 5s
      retries: 20
